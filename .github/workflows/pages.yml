# Publication de l'application sur GitHub Pages (HTTPS), à chaque envoi sur la branche main.
# La compilation recopie le moteur Stockfish (prebuild) et génère le service hors ligne (sw.js).
name: Publication GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Garde-fou : si la vérification des types ou un test unitaire échoue, rien n'est publié.
      - name: Vérification des types
        run: npm run typecheck
      - name: Tests unitaires
        run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
